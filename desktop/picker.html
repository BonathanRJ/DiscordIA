<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Compartilhar tela</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #181b1e; color: #ece9e4; font: 14px/1.4 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 44px 18px 8px; }
  .drag { position: fixed; top: 0; left: 0; right: 0; height: 36px; -webkit-app-region: drag; }
  h1 { margin: 0 0 10px; font-size: 18px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border: 0; background: #262b30; color: #98a0a8; padding: 7px 14px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button.on { background: #ff8a3d; color: #1a0f06; }
  main { flex: 1; overflow-y: auto; padding: 10px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; align-content: start; }
  .src { border: 2px solid transparent; background: #1e2226; border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .src:hover { border-color: #3a4046; }
  .src.sel { border-color: #ff8a3d; }
  .src img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  .src span { display: block; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid #2b3035; }
  label { display: flex; align-items: center; gap: 8px; margin-right: auto; }
  input { accent-color: #ff8a3d; width: 16px; height: 16px; }
  .btn { border: 0; border-radius: 10px; padding: 9px 18px; font: inherit; font-weight: 700; cursor: pointer; background: #262b30; color: inherit; }
  .btn.primary { background: #ff8a3d; color: #1a0f06; }
  .btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="drag"></div>
<header>
  <h1>O que você quer compartilhar?</h1>
  <div class="tabs"><button data-t="screen" class="on">Telas</button><button data-t="window">Janelas</button></div>
</header>
<main id="list"></main>
<footer>
  <label id="audio-wrap"><input type="checkbox" id="audio" checked> Compartilhar o som do PC</label>
  <button class="btn" id="cancel">Cancelar</button>
  <button class="btn primary" id="go" disabled>Compartilhar</button>
</footer>
<script>
  let sources = [], tab = 'screen', selected = null;
  const list = document.getElementById('list');
  function render() {
    list.innerHTML = '';
    for (const s of sources.filter((x) => (tab === 'screen') === x.screen)) {
      const b = document.createElement('button');
      b.className = 'src' + (selected === s.id ? ' sel' : '');
      const img = document.createElement('img'); img.src = s.thumb; img.alt = '';
      const name = document.createElement('span'); name.textContent = s.name;
      b.append(img, name);
      b.onclick = () => { selected = s.id; document.getElementById('go').disabled = false; render(); };
      b.ondblclick = go;
      list.append(b);
    }
    document.getElementById('audio-wrap').style.visibility = tab === 'screen' ? 'visible' : 'hidden';
  }
  function go() { if (selected) window.picker.choose(selected, document.getElementById('audio').checked); }
  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    tab = b.dataset.t; selected = null; document.getElementById('go').disabled = true;
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b)); render();
  });
  document.getElementById('go').onclick = go;
  document.getElementById('cancel').onclick = () => window.picker.choose(null);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.choose(null); });
  window.picker.list().then((s) => { sources = s; const screens = s.filter((x) => x.screen); if (screens.length === 1) { selected = screens[0].id; document.getElementById('go').disabled = false; } render(); });
</script>
</body>
</html>
