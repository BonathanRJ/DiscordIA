  <!-- Tela de entrada -->
  <div id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="brand"><img src="/icon.svg" alt="" width="44" height="44"><div><h1>DiscordIA</h1><p>o canto da galera</p></div></div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="login" role="tab">Entrar</button>
        <button class="tab" data-tab="register" role="tab">Criar conta</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label>Usuário<input name="username" autocomplete="username" required minlength="3" maxlength="24" placeholder="ex: jonathan"></label>
        <label class="reg-only">Nome que aparece<input name="displayName" maxlength="32" placeholder="ex: Jon"></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
        <label class="reg-only">Código de convite<input name="invite" placeholder="quem chamou você passa esse código"></label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn primary big" type="submit" id="auth-submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="titlebar" id="titlebar">
      <div class="tb-nav">
        <button class="tb-btn" id="nav-back" title="Voltar (Alt+←)" disabled><svg><use href="#i-left"/></svg></button>
        <button class="tb-btn" id="nav-fwd" title="Avançar (Alt+→)" disabled><svg><use href="#i-arrow-right"/></svg></button>
      </div>
      <div class="tb-title" id="tb-title"></div>
      <div class="tb-right" id="tb-right"></div>
    </header>
    <aside class="sidebar" id="sidebar">
      <nav class="rail" id="rail" aria-label="Servidores">
        <button class="rail-btn home" id="rail-home" data-tip="Mensagens diretas"><svg><use href="#i-chat"/></svg></button>
        <div class="rail-dms" id="rail-dms"></div>
        <div class="rail-sep"></div>
        <div class="rail-servers" id="rail-servers"></div>
        <div class="rail-sep" id="rail-sep2" hidden></div>
        <button class="rail-btn add" id="rail-add" data-tip="Adicionar um servidor" hidden><svg><use href="#i-plus"/></svg></button>
      </nav>
      <div class="side-col">
        <header class="group-head" id="server-head">
          <span class="server-head-icon" id="server-head-icon"></span>
          <button class="group-name" id="server-name" title="Opções do servidor"><span id="server-name-text"></span><svg class="gn-chev"><use href="#i-chev"/></svg></button>
          <button class="icon-btn" id="btn-invite" title="Convidar amigos" hidden><svg><use href="#i-link"/></svg></button>
        </header>
        <header class="home-head" id="home-head" hidden>
          <button class="find-btn" id="btn-find">Encontre ou comece uma conversa</button>
        </header>
        <nav class="channel-list" id="channel-list" aria-label="Canais"></nav>
      </div>

      <div class="dock">
        <div class="voice-card" id="voice-bar" hidden>
          <div class="vc-top">
            <span class="vc-signal" id="vc-signal" title="Qualidade da conexão"><svg><use href="#i-signal"/></svg></span>
            <div class="voice-bar-info">
              <span class="voice-status" id="voice-status">Conectando…</span>
              <button class="link" id="voice-where" title="Abrir a sala"></button>
            </div>
            <button class="icon-btn" id="btn-ns" title="Supressão de ruído"><svg><use href="#i-wave"/></svg></button>
            <button class="icon-btn danger" id="btn-leave" title="Sair da voz"><svg><use href="#i-phone-off"/></svg></button>
          </div>
          <div class="vc-actions">
            <button class="vc-btn" id="btn-cam" title="Ligar câmera"><svg><use href="#i-cam"/></svg></button>
            <button class="vc-btn" id="btn-screen" title="Compartilhar tela"><svg><use href="#i-screen"/></svg></button>
            <button class="vc-btn" id="btn-stage" title="Abrir a sala"><svg><use href="#i-grid"/></svg></button>
            <button class="vc-btn" id="btn-music" title="Música (ouvir juntos)"><svg><use href="#i-music"/></svg></button>
            <button class="vc-btn" id="btn-voice-settings" title="Configurações de voz"><svg><use href="#i-sliders"/></svg></button>
          </div>
          <div class="music-panel" id="music-panel" hidden></div>
        </div>

        <footer class="me-bar" id="me-bar">
          <div class="me-id" id="me-id"></div>
          <div class="split">
            <button class="icon-btn" id="btn-mute" title="Silenciar microfone"><svg><use href="#i-mic"/></svg></button>
            <button class="caret" id="mic-menu" title="Escolher microfone"><svg><use href="#i-chev"/></svg></button>
          </div>
          <div class="split">
            <button class="icon-btn" id="btn-deafen" title="Desligar áudio"><svg><use href="#i-head"/></svg></button>
            <button class="caret" id="spk-menu" title="Escolher saída de áudio"><svg><use href="#i-chev"/></svg></button>
          </div>
          <button class="icon-btn" id="btn-settings" title="Configurações"><svg><use href="#i-gear"/></svg></button>
        </footer>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="chan-head">
        <button class="icon-btn only-mobile" id="btn-menu" title="Canais"><svg><use href="#i-menu"/></svg></button>
        <svg class="chan-head-icon" id="chan-icon"><use href="#i-hash"/></svg>
        <span id="chan-avatar" hidden></span>
        <h2 id="chan-title"></h2>
        <div class="head-tabs" id="head-tabs" hidden></div>
        <span class="spacer"></span>
        <button class="icon-btn" id="btn-dm-call" title="Iniciar chamada de voz" hidden><svg><use href="#i-phone"/></svg></button>
        <button class="icon-btn" id="btn-dm-video" title="Iniciar chamada de vídeo" hidden><svg><use href="#i-cam"/></svg></button>
        <button class="icon-btn" id="btn-profile" title="Mostrar perfil do usuário" hidden><svg><use href="#i-profile"/></svg></button>

        <button class="icon-btn" id="btn-members" title="Mostrar lista de membros"><svg><use href="#i-users"/></svg></button>
        <div class="search-wrap" id="search-wrap">
          <label class="search-box"><input id="search-input" type="text" autocomplete="off" spellcheck="false" placeholder="Buscar"><button type="button" class="search-clear" id="search-clear" title="Limpar busca" hidden><svg><use href="#i-x"/></svg></button><svg class="search-ic"><use href="#i-search"/></svg></label>
        </div>
      </header>

      <section class="chat" id="chat-view">
        <div class="dm-call" id="dm-call" hidden></div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="typing" id="typing"></div>
        <form class="composer" id="composer">
          <div class="replying" id="replying" hidden></div>
          <div class="pending-file" id="pending-file" hidden></div>
          <div class="composer-row">
            <button type="button" class="icon-btn" id="btn-attach" title="Enviar arquivo"><svg><use href="#i-clip"/></svg></button>
            <input type="file" id="file-input" hidden>
            <textarea id="input" rows="1" maxlength="4000" placeholder="Mensagem"></textarea>
            <button type="submit" class="icon-btn send" title="Enviar"><svg><use href="#i-send"/></svg></button>
          </div>
        </form>
      </section>

      <section class="friends" id="friends-view" hidden></section>

      <section class="stage" id="voice-view" hidden>
        <div class="tiles" id="tiles"></div>
        <div class="stage-controls">
          <button class="round-btn" id="st-mute" title="Microfone"><svg><use href="#i-mic"/></svg></button>
          <button class="round-btn" id="st-deafen" title="Desligar áudio (não ouvir ninguém)"><svg><use href="#i-head"/></svg></button>
          <button class="round-btn" id="st-cam" title="Câmera"><svg><use href="#i-cam"/></svg></button>
          <button class="round-btn" id="st-screen" title="Tela"><svg><use href="#i-screen"/></svg></button>
          <button class="round-btn danger" id="st-leave" title="Sair"><svg><use href="#i-phone-off"/></svg></button>
        </div>
      </section>
    </main>

    <aside class="members" id="members"></aside>
    <aside class="profile-panel" id="profile-panel"></aside>
    <aside class="search-panel" id="search-panel" hidden></aside>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div class="toasts" id="toasts"></div>
  <div id="audio-sink" hidden></div>

  <script src="/vendor/livekit-client.umd.js"></script>
  <script>window.LivekitClient || document.write('<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"><\/script>')</script>
  <script type="module" src="/app.js"></script>
</body>
</html>
